name: CI Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore BytePizza.slnx

      - name: Build solution
        run: dotnet build BytePizza.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test BytePizza.slnx --configuration Release
